name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# A newer push to the same branch / PR cancels the older run. Tags are their own ref, so a release run
# is never cancelled by a later push to main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # irremote.3dsx and irremote.cia
  IRRemote:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v7
      - name: Install makerom, bannertool
        # for the CIA; not part of devkitPro. Pinned and checksummed. makerom is built from source: its
        # prebuilt Linux binary needs a newer glibc than this container has.
        run: |
          command -v gcc && command -v g++ && command -v python3 || (apt-get update && apt-get install -y --no-install-recommends build-essential python3)
          mkdir -p "$RUNNER_TEMP/ctrtools" && cd "$RUNNER_TEMP/ctrtools"
          curl -fsSLo ctr.tar.gz https://github.com/3DSGuy/Project_CTR/archive/refs/tags/makerom-v0.19.0.tar.gz
          curl -fsSLo bannertool.zip https://github.com/diasurgical/bannertool/releases/download/1.2.0/bannertool.zip
          sha256sum -c - <<'SUMS'
          446bd23919b7e9fa10540a784202d388a0b93ef4d7165f3990481edd2aa2f946  ctr.tar.gz
          69768596f836acb3e3aeaa66e47c6ba560dde813c6dfcd33c8afc25fe29b7524  bannertool.zip
          SUMS
          tar xzf ctr.tar.gz
          make -C Project_CTR-makerom-v0.19.0/makerom -j"$(nproc)" deps
          make -C Project_CTR-makerom-v0.19.0/makerom -j"$(nproc)" program
          python3 -m zipfile -e bannertool.zip bannertool
          install -m755 Project_CTR-makerom-v0.19.0/makerom/bin/makerom bannertool/linux-x86_64/bannertool /usr/local/bin/
      - name: Build (.3dsx and .cia)
        run: make -j"$(nproc)" cia
      - uses: actions/upload-artifact@v7
        with:
          name: IRRemote
          path: |
            irremote.3dsx
            irremote.cia

  # The encoder on the host (tests/host_test.c): every protocol rendered, run through a simulated IrDA
  # encoder and receiver, and checked against known on-air codes.
  host-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: cc -O2 -Wall -Isource tests/host_test.c source/irenc.c source/irfile.c -o host_test
      - name: Run
        run: ./host_test

  # A v* tag: the .3dsx and the .cia as a GitHub release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [IRRemote, host-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: IRRemote
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            irremote.3dsx
            irremote.cia
